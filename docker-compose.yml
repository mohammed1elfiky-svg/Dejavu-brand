services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dejavu
      POSTGRES_PASSWORD: dejavu
      POSTGRES_DB: dejavu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dejavu"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dejavu:dejavu@postgres:5432/dejavu
      # Demo-only secret. Generate a real one for any shared deployment.
      JWT_ACCESS_SECRET: local-demo-secret-not-for-production-0123456789
      DEMO_DATA: "true"
      # Local demo: the built-in test card page instead of a real gateway.
      NODE_ENV: development
      PAYMENT_GATEWAY: test
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
