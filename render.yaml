# Render Blueprint: API + PostgreSQL in one click.
# Dashboard → New → Blueprint → pick this repository. See docs/DEPLOY.md.
services:
  - type: web
    name: dejavu-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dejavu-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # First admin account (created on the first start only).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Demo products, orders and accounts to try the apps. Set to "false" (or remove)
      # before using it as a real store: demo accounts have well-known passwords.
      - key: DEMO_DATA
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Card payments stay off until Paymob keys are added in the dashboard
      # (PAYMENT_GATEWAY=paymob + PAYMOB_* , see docs/DEPLOY.md). Push: FCM_SERVICE_ACCOUNT.
      - key: PAYMENT_GATEWAY
        value: none

databases:
  - name: dejavu-db
    plan: free
    region: frankfurt
    databaseName: dejavu
    user: dejavu
