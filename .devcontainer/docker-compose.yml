services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so the API reaches it on localhost:5432,
    # matching backend/.env.example.
    network_mode: service:db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dejavu
      POSTGRES_PASSWORD: dejavu
      POSTGRES_DB: dejavu
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data

volumes:
  devcontainer-pgdata:
