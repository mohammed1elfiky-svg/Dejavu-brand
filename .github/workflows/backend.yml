name: Backend

on:
  push:
    paths: ['backend/**', '.devcontainer/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.devcontainer/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dejavu
          POSTGRES_PASSWORD: dejavu
          POSTGRES_DB: dejavu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dejavu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dejavu:dejavu@localhost:5432/dejavu
      JWT_ACCESS_SECRET: ci-only-secret-that-is-long-enough-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      # Same steps a new Codespace runs, so a broken demo setup fails CI.
      - run: npm run db:deploy && npm run db:seed && npm run db:seed:demo

  # Builds the production image; after tests pass on a push it is published to
  # ghcr.io/<owner>/dejavu-api (tags: branch name, sha-xxxxxxx, latest on the default branch).
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dejavu-api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
