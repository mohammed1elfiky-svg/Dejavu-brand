org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend both apps talk to out of the box (the cloud server on Render).
# Override per build, e.g. for the emulator: ./gradlew assembleDebug -Pdejavu.apiBaseUrl=http://10.0.2.2:3000/api/v1/
dejavu.apiBaseUrl=https://dejavu.zapto.org/api/v1/

# Customer app: more server addresses to try in order (comma separated), and the directory file
# the server keeps on GitHub with the owner's current list (read when no address answers).
dejavu.fallbackServers=
dejavu.serverDirectoryUrl=https://raw.githubusercontent.com/mohammed1elfiky-svg/Dejavu-brand/app-directory/servers.json
