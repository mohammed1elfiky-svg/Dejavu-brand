# Render Blueprint: API + PostgreSQL in one click.
# Dashboard → New → Blueprint → pick this repository. See docs/DEPLOY.md.
services:
  - type: web
    name: dejavu-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dejavu-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # First admin account (created on the first start only).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # "true" loads demo products, orders and accounts: for a demo server only.
      - key: DEMO_DATA
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      # none until Paymob keys are added; then set to "paymob".
      - key: PAYMENT_GATEWAY
        value: none
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false

databases:
  - name: dejavu-db
    plan: free
    region: frankfurt
    databaseName: dejavu
    user: dejavu
